name: New gate
description: Propose a check that should run before something is published
labels: ["new gate"]
body:
  - type: input
    id: gate_id
    attributes:
      label: Gate id
      description: lowercase with dashes, e.g. youtube-thumbnail
    validations:
      required: true
  - type: textarea
    id: catches
    attributes:
      label: What would it catch?
      description: The mistake, and what happens when it reaches the platform (rejection, takedown, refund, bad playback).
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Rule source
      description: Link to the platform help page or standard. If the threshold is your own judgment, say so.
    validations:
      required: true
  - type: textarea
    id: test_files
    attributes:
      label: How to make a PASS file and a FAIL file
      description: Small, shareable examples (no real customer files).
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: The gate reads local files only (no login, scraping, upload or publishing)
          required: true
        - label: I would like to build this gate myself
