name: Bug report
description: A gate crashed, gave a wrong verdict, or the CLI misbehaved
labels: ["bug"]
body:
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: gatepack check loudness clip.mp4 --json
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: versions
    attributes:
      label: Versions
      description: gatepack --version, python --version, ffmpeg -version (first line), operating system
  - type: markdown
    attributes:
      value: Please do not attach files you have no right to share. A small sample that shows the problem is best.
